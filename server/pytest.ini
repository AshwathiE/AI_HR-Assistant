[pytest]
# ---------------------------------------------------------------------------
# pytest.ini — pytest configuration for the AI HR Assistant test suite
# ---------------------------------------------------------------------------

# Root directory for test discovery (relative to this file's location)
testpaths = tests

# Minimum pytest version required
minversion = 7.0

# Default options applied to every run:
#   -v          : verbose output (test name + PASSED/FAILED per line)
#   --tb=short  : compact traceback on failure
#   -p no:warnings : suppress noisy deprecation warnings from third-party libs
addopts = -v --tb=short -p no:warnings

# Map custom markers so pytest does not warn about unregistered ones
markers =
    unit: Pure unit tests with no I/O
    integration: Tests that spin up the FastAPI test client
    slow: Tests that are computationally heavier (excluded from fast runs)

# Log level shown in the terminal during a test run
log_cli = true
log_cli_level = WARNING
